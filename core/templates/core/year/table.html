<div class="card table-card">
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Start Year</th>
                    <th>Last Year</th>
                    <th class="text-center">Aksi</th>
                </tr>
            </thead>
            <tbody>
                {% for year in page_obj %}
                    <tr>
                        <td>{{ forloop.counter0|add:page_obj.start_index }}</td>
                        <td class="font-weight-600">{{ year.start_year }}</td>
                        <td>{{ year.finish_year }}</td>
                        <td class="text-center">
                            <div class="btn-group justify-content-center">
                                <a href="{% url 'core:year_update' year.pk %}"
                                   class="btn btn-icon"
                                   title="Edit"><i class="fa-solid fa-pen"></i></a>
                                <button type="button"
                                        class="btn btn-icon btn-delete"
                                        data-url="{% url 'core:year_delete' year.pk %}"
                                        title="Hapus">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="4" class="empty-state">Tidak ada data tahun ajaran.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% include 'core/base/pagination.html' %}
</div>
