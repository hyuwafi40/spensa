<div class="modal-backdrop" id="logDetailModal">
    <div class="modal-window">
        <div class="modal-header">
            <h3>Detail Log</h3>
            <button class="icon-btn" id="logDetailModalClose">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="log-detail-list">
                <p><strong>Waktu:</strong> <span id="logDetailCreated"></span></p>
                <p><strong>Level:</strong> <span id="logDetailLevel"></span></p>
                <p><strong>Event:</strong> <span id="logDetailEvent"></span></p>
                <p><strong>Path:</strong> <span id="logDetailPath"></span></p>
                <p><strong>Method:</strong> <span id="logDetailMethod"></span></p>
                <p><strong>Status Code:</strong> <span id="logDetailStatus"></span></p>
                <p><strong>User:</strong> <span id="logDetailUser"></span></p>
                <p><strong>Modul:</strong> <span id="logDetailModule"></span></p>
                <p><strong>Aksi:</strong> <span id="logDetailAction"></span></p>
                <p><strong>Objek:</strong> <span id="logDetailObjectRepr"></span></p>
                <p><strong>IP Address:</strong> <span id="logDetailIp"></span></p>
                <p><strong>User Agent:</strong> <span id="logDetailUserAgent"></span></p>
                <p>
                    <strong>Metadata:</strong> <pre id="logDetailMetadata"></pre>
                </p>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" id="logDetailModalCancel">Tutup</button>
        </div>
    </div>
</div>
